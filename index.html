<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XO Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #e94560, #0f3460);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            font-size: 1.3rem;
            margin-bottom: 20px;
            height: 40px;
            display: flex;
            align-items: center;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 6px;
        }

        .cell {
            width: 120px;
            height: 120px;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            user-select: none;
        }

        .cell:hover {
            background: #1a1a40;
            transform: scale(1.05);
        }

        .cell.x {
            color: #e94560;
            text-shadow: 0 0 12px rgba(233, 69, 96, 0.5);
        }

        .cell.o {
            color: #0f9bea;
            text-shadow: 0 0 12px rgba(15, 155, 234, 0.5);
        }

        .cell.win {
            background: #0f3460;
            animation: pulse 0.6s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            to { transform: scale(1.08); }
        }

        .restart {
            margin-top: 25px;
            padding: 12px 36px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #e94560, #0f3460);
            color: #fff;
            cursor: pointer;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }

        .restart:hover {
            opacity: 0.85;
        }

        .scoreboard {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .scoreboard span {
            padding: 6px 18px;
            border-radius: 8px;
            background: #16213e;
        }

        .score-x { color: #e94560; }
        .score-o { color: #0f9bea; }
    </style>
</head>
<body>
    <h1>XO GAME</h1>
    <div class="scoreboard">
        <span class="score-x">X: <b id="sx">0</b></span>
        <span>Draw: <b id="sd">0</b></span>
        <span class="score-o">O: <b id="so">0</b></span>
    </div>
    <div class="status" id="status">Turn: X</div>
    <div class="board" id="board"></div>
    <button class="restart" onclick="init()">Restart</button>

    <script>
        const board = document.getElementById('board');
        const status = document.getElementById('status');
        let cells, current, gameOver, scores = { X: 0, O: 0, D: 0 };

        const wins = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];

        function init() {
            board.innerHTML = '';
            cells = Array(9).fill('');
            current = 'X';
            gameOver = false;
            status.textContent = 'Turn: X';
            for (let i = 0; i < 9; i++) {
                const div = document.createElement('div');
                div.className = 'cell';
                div.addEventListener('click', () => play(i));
                board.appendChild(div);
            }
        }

        function play(i) {
            if (cells[i] || gameOver) return;
            cells[i] = current;
            const el = board.children[i];
            el.textContent = current;
            el.classList.add(current.toLowerCase());

            const winCombo = wins.find(w => w.every(j => cells[j] === current));
            if (winCombo) {
                gameOver = true;
                status.textContent = current + ' Wins!';
                winCombo.forEach(j => board.children[j].classList.add('win'));
                scores[current]++;
                updateScores();
                return;
            }

            if (cells.every(c => c)) {
                gameOver = true;
                status.textContent = "It's a Draw!";
                scores.D++;
                updateScores();
                return;
            }

            current = current === 'X' ? 'O' : 'X';
            status.textContent = 'Turn: ' + current;
        }

        function updateScores() {
            document.getElementById('sx').textContent = scores.X;
            document.getElementById('so').textContent = scores.O;
            document.getElementById('sd').textContent = scores.D;
        }

        init();
    </script>
</body>
</html>
