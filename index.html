<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Escape Bou6!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #2d5a27;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            width: 90%;
        }
        #ui h1 {
            font-size: 1.4rem;
            margin-bottom: 2px;
            color: #ffe066;
        }
        #ui .info {
            font-size: 0.8rem;
            opacity: 0.9;
        }
        #ui .stats {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-top: 3px;
            font-size: 0.78rem;
        }
        #ui .stats span {
            min-width: 52px;
            padding: 2px 7px;
            border-radius: 8px;
            background: rgba(0,0,0,0.28);
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            border: 2px solid #1a3d15;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            touch-action: none;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            flex-direction: column;
        }
        #overlay.show { display: flex; }
        #overlay h2 {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 10px;
        }
        #overlay .sub {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 15px;
            text-align: center;
            padding: 0 20px;
        }
        #overlay button {
            padding: 14px 40px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #ffe066;
            color: #333;
            font-weight: bold;
            transition: transform 0.1s;
        }
        #overlay button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Escape Bou6!</h1>
        <div class="info">Level <span id="levelNum">1</span> - Draw through streets to reach HOME.</div>
        <div class="stats">
            <span>Stars <b id="starCount">0</b>/<b id="starTotal">0</b></span>
            <span>Arrows <b id="boostState">0</b></span>
        </div>
    </div>
    <div id="gameContainer">
        <canvas id="game"></canvas>
    </div>
    <div id="overlay">
        <h2 id="overlayTitle">CAUGHT!</h2>
        <div class="sub" id="overlaySub">Bou6 got you!</div>
        <button id="overlayBtn">Try Again</button>
    </div>

    <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const overlayBtn = document.getElementById('overlayBtn');
    const levelNumEl = document.getElementById('levelNum');
    const starCountEl = document.getElementById('starCount');
    const starTotalEl = document.getElementById('starTotal');
    const boostStateEl = document.getElementById('boostState');

    // Responsive sizing - fit to phone screen
    const GRID_COLS = 15;
    const GRID_ROWS = 20;
    let TILE, W, H, scale;

    function resize() {
        const maxW = window.innerWidth - 10;
        const maxH = window.innerHeight - 78;
        TILE = Math.floor(Math.min(maxW / GRID_COLS, maxH / GRID_ROWS));
        if (TILE < 10) TILE = 10;
        W = TILE * GRID_COLS;
        H = TILE * GRID_ROWS;
        canvas.width = W;
        canvas.height = H;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        // Recalculate pixel positions if game is initialized
        if (grid.length > 0) {
            playerPixel = { x: playerPos.x * TILE + TILE / 2, y: playerPos.y * TILE + TILE / 2 };
            bou6Pixel = { x: Math.floor(bou6Pixel.x / (W / GRID_COLS)) * TILE + TILE / 2, y: Math.floor(bou6Pixel.y / (H / GRID_ROWS)) * TILE + TILE / 2 };
            path = tilePath.map(tileToPixel);
            draw();
        }
    }

    window.addEventListener('resize', resize);

    let level = 1;
    let grid = [];
    let playerPos = { x: 0, y: 0 };
    let homePos = { x: 0, y: 0 };
    let path = [];
    let tilePath = [];
    let pathIndex = 0;
    let drawing = false;
    let gameStarted = false;
    let gameOver = false;
    let won = false;
    let bou6Speed = 2.0;
    let playerSpeed = 2.0;
    let animFrame = null;
    let lastTime = 0;
    let gameStartTime = 0;
    let bou6Path = [];
    let bou6PathIndex = 0;
    let playerPixel = { x: 0, y: 0 };
    let bou6Pixel = { x: 0, y: 0 };
    let stars = [];
    let collectedStars = 0;
    let boostPickups = [];
    let boostUntil = 0;
    let bou6BoostUntil = 0;
    let chaseDelay = 650;

    function seedRandom(seed) {
        return function() {
            seed = (seed * 16807 + 0) % 2147483647;
            return (seed - 1) / 2147483646;
        };
    }

    function tileToPixel(tile) {
        return { x: tile.x * TILE + TILE / 2, y: tile.y * TILE + TILE / 2 };
    }

    function sameTile(a, b) {
        return a && b && a.x === b.x && a.y === b.y;
    }

    function isStreetTile(tile) {
        return tile.x >= 0 && tile.x < GRID_COLS && tile.y >= 0 && tile.y < GRID_ROWS && grid[tile.y][tile.x] === 0;
    }

    function tileDistance(a, b) {
        return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    }

    // Generate neighborhood: houses as blocks with streets running between them
    function generateLevel(num) {
        // Start with all streets (0), then place house blocks with guaranteed street gaps
        const g = Array(GRID_ROWS).fill(null).map(() => Array(GRID_COLS).fill(0));
        const rng = seedRandom(num * 1337);

        // Place house blocks in a grid pattern with streets between them
        // Streets are every few rows/cols, houses fill the blocks between streets
        const streetFreqX = 3 + Math.floor(rng() * 2); // street every 3-4 cols
        const streetFreqY = 3 + Math.floor(rng() * 2); // street every 3-4 rows

        for (let y = 0; y < GRID_ROWS; y++) {
            for (let x = 0; x < GRID_COLS; x++) {
                // Keep borders as streets
                if (x === 0 || x === GRID_COLS - 1 || y === 0 || y === GRID_ROWS - 1) continue;
                // Streets at regular intervals
                if (x % streetFreqX === 0 || y % streetFreqY === 0) continue;
                // Fill as house
                g[y][x] = 1;
            }
        }

        // Add some random gaps in houses (alleys/shortcuts) - more in later levels means fewer shortcuts
        const alleyCount = Math.max(8 - num, 3);
        for (let i = 0; i < alleyCount; i++) {
            const ax = Math.floor(rng() * (GRID_COLS - 4)) + 2;
            const ay = Math.floor(rng() * (GRID_ROWS - 4)) + 2;
            const horizontal = rng() > 0.5;
            const len = Math.floor(rng() * 3) + 2;
            for (let j = 0; j < len; j++) {
                const nx = horizontal ? ax + j : ax;
                const ny = horizontal ? ay : ay + j;
                if (nx > 0 && nx < GRID_COLS - 1 && ny > 0 && ny < GRID_ROWS - 1) {
                    g[ny][nx] = 0;
                }
            }
        }

        // Add extra house blocks in higher levels for complexity
        const extraBlocks = num * 2;
        for (let i = 0; i < extraBlocks; i++) {
            const bx = Math.floor(rng() * (GRID_COLS - 6)) + 3;
            const by = Math.floor(rng() * (GRID_ROWS - 6)) + 3;
            // Only place if it's currently a street and won't block key areas
            if (by % streetFreqY === 0 && bx % streetFreqX !== 0) {
                g[by][bx] = 1;
            }
        }

        // Clear player start (bottom-left)
        for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
                const cy = GRID_ROWS - 2 + dy;
                const cx = 1 + dx;
                if (cy >= 0 && cy < GRID_ROWS && cx >= 0 && cx < GRID_COLS) g[cy][cx] = 0;
            }
        }
        // Clear home (top-right)
        for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
                const cy = 1 + dy;
                const cx = GRID_COLS - 2 + dx;
                if (cy >= 0 && cy < GRID_ROWS && cx >= 0 && cx < GRID_COLS) g[cy][cx] = 0;
            }
        }
        // Clear bou6 start (top-left area but offset)
        g[2][2] = 0; g[2][3] = 0; g[3][2] = 0;

        return g;
    }

    const levels = [];
    for (let i = 1; i <= 5; i++) levels.push(generateLevel(i));

    function initLevel() {
        // Set canvas size first
        const maxW = window.innerWidth - 10;
        const maxH = window.innerHeight - 78;
        TILE = Math.floor(Math.min(maxW / GRID_COLS, maxH / GRID_ROWS));
        if (TILE < 10) TILE = 10;
        W = TILE * GRID_COLS;
        H = TILE * GRID_ROWS;
        canvas.width = W;
        canvas.height = H;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';

        const idx = Math.min(level - 1, levels.length - 1);
        grid = levels[idx].map(row => [...row]);
        playerPos = { x: 1, y: GRID_ROWS - 2 };
        homePos = { x: GRID_COLS - 2, y: 1 };
        const bou6Start = { x: 2, y: 2 };
        playerPixel = { x: playerPos.x * TILE + TILE / 2, y: playerPos.y * TILE + TILE / 2 };
        bou6Pixel = { x: bou6Start.x * TILE + TILE / 2, y: bou6Start.y * TILE + TILE / 2 };
        path = [];
        tilePath = [];
        pathIndex = 0;
        drawing = false;
        gameStarted = false;
        gameOver = false;
        won = false;
        bou6Speed = 92 + (level - 1) * 13;
        playerSpeed = 118;
        bou6Path = [];
        bou6PathIndex = 0;
        boostUntil = 0;
        bou6BoostUntil = 0;
        chaseDelay = Math.max(250, 750 - (level - 1) * 90);
        generatePickups(level);
        levelNumEl.textContent = level;
        updateStats();
        overlay.classList.remove('show');
        draw();
    }

    function generatePickups(num) {
        const rng = seedRandom(num * 2917);
        const candidates = [];
        const start = { x: 1, y: GRID_ROWS - 2 };
        const home = { x: GRID_COLS - 2, y: 1 };

        for (let y = 1; y < GRID_ROWS - 1; y++) {
            for (let x = 1; x < GRID_COLS - 1; x++) {
                const tile = { x, y };
                if (!isStreetTile(tile)) continue;
                if (tileDistance(tile, start) < 5 || tileDistance(tile, home) < 3 || tileDistance(tile, { x: 2, y: 2 }) < 3) continue;
                if (findPath(start, tile).length && findPath(tile, home).length) candidates.push(tile);
            }
        }

        for (let i = candidates.length - 1; i > 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }

        stars = candidates.slice(0, 3).map(tile => ({ ...tile, collected: false }));
        boostPickups = candidates
            .filter(tile => !stars.some(star => sameTile(star, tile)))
            .slice(0, Math.min(3, 1 + Math.floor(num / 2)));
        collectedStars = 0;
    }

    function updateStats() {
        starCountEl.textContent = collectedStars;
        starTotalEl.textContent = stars.length;
        const now = performance.now();
        if (boostUntil > now) boostStateEl.textContent = 'You';
        else if (bou6BoostUntil > now) boostStateEl.textContent = 'Bou6';
        else boostStateEl.textContent = boostPickups.length;
    }

    function draw() {
        ctx.fillStyle = '#4a8c3f';
        ctx.fillRect(0, 0, W, H);

        for (let y = 0; y < GRID_ROWS; y++) {
            for (let x = 0; x < GRID_COLS; x++) {
                const px = x * TILE;
                const py = y * TILE;
                if (grid[y][x] === 1) {
                    drawBuildingTile(px, py, x, y);
                } else {
                    // Street - asphalt look
                    ctx.fillStyle = '#5d6352';
                    ctx.fillRect(px, py, TILE, TILE);
                    // Subtle grid line
                    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                    ctx.strokeRect(px, py, TILE, TILE);
                    drawStreetDetail(px, py, x, y);
                }
            }
        }

        // Home marker
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(homePos.x * TILE + 2, homePos.y * TILE + 2, TILE - 4, TILE - 4);
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(8, TILE * 0.28)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('HOME', homePos.x * TILE + TILE / 2, homePos.y * TILE + TILE / 2);

        // Bonus stars reward longer but riskier routes.
        for (const star of stars) {
            if (star.collected) continue;
            const center = tileToPixel(star);
            drawStar(center.x, center.y, TILE * 0.28);
        }

        for (const boost of boostPickups) {
            const center = tileToPixel(boost);
            drawSpeedArrow(center.x, center.y);
        }

        // Drawn path
        if (path.length > 1) {
            ctx.strokeStyle = 'rgba(52, 152, 219, 0.7)';
            ctx.lineWidth = TILE * 0.2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();
            ctx.lineWidth = 1;
        }

        // Player
        drawPlayer(playerPixel.x, playerPixel.y);
        // Bou6
        drawBou6(bou6Pixel.x, bou6Pixel.y);

        // Instruction
        if (!gameStarted && !gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, H - TILE * 1.5, W, TILE * 1.5);
            ctx.fillStyle = '#fff';
            ctx.font = `${Math.max(11, TILE * 0.4)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Draw a connected street route to HOME. Detour for stars.', W / 2, H - TILE * 0.75);
        }
    }

    function drawStar(x, y, radius) {
        ctx.fillStyle = '#f1c40f';
        ctx.strokeStyle = '#b7950b';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
            const angle = -Math.PI / 2 + i * Math.PI / 5;
            const r = i % 2 === 0 ? radius : radius * 0.45;
            const px = x + Math.cos(angle) * r;
            const py = y + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }

    function tileNoise(x, y, salt = 0) {
        const n = Math.sin((x * 127.1 + y * 311.7 + level * 74.7 + salt * 19.3)) * 43758.5453;
        return n - Math.floor(n);
    }

    function drawBuildingTile(px, py, gx, gy) {
        const type = Math.floor(tileNoise(gx, gy, 1) * 5);
        const pad = Math.max(1, TILE * 0.05);
        const x = px + pad;
        const y = py + pad;
        const w = TILE - pad * 2;
        const h = TILE - pad * 2;

        if (type === 0) {
            drawAdobeBuilding(x, y, w, h, gx, gy);
        } else if (type === 1) {
            drawPaintedStorefront(x, y, w, h, gx, gy);
        } else if (type === 2) {
            drawBalconyBuilding(x, y, w, h, gx, gy);
        } else if (type === 3) {
            drawCorrugatedShop(x, y, w, h, gx, gy);
        } else {
            drawClassicHouse(x, y, w, h);
        }
    }

    function drawAdobeBuilding(x, y, w, h, gx, gy) {
        ctx.fillStyle = tileNoise(gx, gy, 2) > 0.5 ? '#c78d5f' : '#d8a66f';
        ctx.fillRect(x, y + h * 0.1, w, h * 0.9);
        ctx.fillStyle = '#a96f45';
        ctx.fillRect(x, y + h * 0.08, w, h * 0.12);

        ctx.fillStyle = '#593a2a';
        ctx.beginPath();
        ctx.moveTo(x + w * 0.34, y + h);
        ctx.lineTo(x + w * 0.34, y + h * 0.66);
        ctx.quadraticCurveTo(x + w * 0.5, y + h * 0.48, x + w * 0.66, y + h * 0.66);
        ctx.lineTo(x + w * 0.66, y + h);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#f6e6ba';
        ctx.fillRect(x + w * 0.12, y + h * 0.34, w * 0.18, h * 0.18);
        ctx.fillRect(x + w * 0.70, y + h * 0.34, w * 0.18, h * 0.18);

        ctx.strokeStyle = '#7a4d31';
        ctx.lineWidth = Math.max(1, TILE * 0.035);
        ctx.beginPath();
        ctx.moveTo(x + w * 0.12, y + h * 0.18);
        ctx.lineTo(x + w * 0.12, y);
        ctx.moveTo(x + w * 0.50, y + h * 0.18);
        ctx.lineTo(x + w * 0.50, y - h * 0.07);
        ctx.moveTo(x + w * 0.88, y + h * 0.18);
        ctx.lineTo(x + w * 0.88, y);
        ctx.stroke();
    }

    function drawPaintedStorefront(x, y, w, h, gx, gy) {
        const colors = ['#f1c40f', '#2ecc71', '#e67e22', '#3498db'];
        ctx.fillStyle = colors[Math.floor(tileNoise(gx, gy, 3) * colors.length)];
        ctx.fillRect(x, y + h * 0.08, w, h * 0.92);
        ctx.fillStyle = '#7f4f24';
        ctx.fillRect(x, y, w, h * 0.16);

        const stripeW = w / 5;
        for (let i = 0; i < 5; i++) {
            ctx.fillStyle = i % 2 ? '#f9e79f' : '#c0392b';
            ctx.fillRect(x + i * stripeW, y + h * 0.18, stripeW, h * 0.13);
        }

        ctx.fillStyle = '#263238';
        ctx.fillRect(x + w * 0.18, y + h * 0.52, w * 0.25, h * 0.48);
        ctx.fillStyle = '#d6eaf8';
        ctx.fillRect(x + w * 0.57, y + h * 0.48, w * 0.28, h * 0.24);
    }

    function drawBalconyBuilding(x, y, w, h, gx, gy) {
        ctx.fillStyle = tileNoise(gx, gy, 4) > 0.5 ? '#d7ccc8' : '#b0bec5';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#90a4ae';
        ctx.fillRect(x, y, w, h * 0.16);

        ctx.fillStyle = '#263238';
        ctx.fillRect(x + w * 0.12, y + h * 0.22, w * 0.22, h * 0.18);
        ctx.fillRect(x + w * 0.64, y + h * 0.22, w * 0.22, h * 0.18);
        ctx.strokeStyle = '#455a64';
        ctx.lineWidth = Math.max(1, TILE * 0.035);
        ctx.strokeRect(x + w * 0.08, y + h * 0.48, w * 0.84, h * 0.20);
        ctx.fillStyle = '#6d4c41';
        ctx.fillRect(x + w * 0.42, y + h * 0.68, w * 0.18, h * 0.32);

        ctx.strokeStyle = '#263238';
        ctx.beginPath();
        ctx.arc(x + w * 0.78, y + h * 0.06, w * 0.12, Math.PI * 0.15, Math.PI * 1.25);
        ctx.moveTo(x + w * 0.72, y + h * 0.08);
        ctx.lineTo(x + w * 0.60, y + h * 0.20);
        ctx.stroke();
    }

    function drawCorrugatedShop(x, y, w, h, gx, gy) {
        ctx.fillStyle = '#8d6e63';
        ctx.fillRect(x, y + h * 0.24, w, h * 0.76);
        ctx.fillStyle = '#b0bec5';
        ctx.beginPath();
        ctx.moveTo(x - w * 0.04, y + h * 0.24);
        ctx.lineTo(x + w * 0.50, y);
        ctx.lineTo(x + w * 1.04, y + h * 0.24);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#78909c';
        ctx.lineWidth = 1;
        for (let i = 0; i < 5; i++) {
            const sx = x + w * (0.1 + i * 0.2);
            ctx.beginPath();
            ctx.moveTo(sx, y + h * 0.07);
            ctx.lineTo(sx + w * 0.16, y + h * 0.23);
            ctx.stroke();
        }

        ctx.fillStyle = '#263238';
        ctx.fillRect(x + w * 0.18, y + h * 0.52, w * 0.24, h * 0.48);
        ctx.fillStyle = '#fdd835';
        ctx.fillRect(x + w * 0.55, y + h * 0.48, w * 0.28, h * 0.16);
    }

    function drawClassicHouse(x, y, w, h) {
        ctx.fillStyle = '#b03a2e';
        ctx.fillRect(x, y + h * 0.2, w, h * 0.8);
        ctx.fillStyle = '#7b241c';
        ctx.beginPath();
        ctx.moveTo(x - w * 0.05, y + h * 0.32);
        ctx.lineTo(x + w / 2, y);
        ctx.lineTo(x + w * 1.05, y + h * 0.32);
        ctx.fill();
        ctx.fillStyle = '#f9e79f';
        ctx.fillRect(x + w * 0.3, y + h * 0.48, w * 0.4, h * 0.32);
    }

    function drawStreetDetail(px, py, gx, gy) {
        const n = tileNoise(gx, gy, 9);
        if (n < 0.88) return;
        const ox = px + TILE * (0.18 + tileNoise(gx, gy, 10) * 0.58);
        const oy = py + TILE * (0.20 + tileNoise(gx, gy, 11) * 0.55);

        if (n < 0.94) {
            drawTrashPile(ox, oy, gx, gy);
        } else {
            drawTrashBin(ox, oy);
        }
    }

    function drawTrashPile(x, y, gx, gy) {
        ctx.fillStyle = '#2e2e2e';
        ctx.beginPath();
        ctx.ellipse(x, y + TILE * 0.05, TILE * 0.16, TILE * 0.08, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = tileNoise(gx, gy, 12) > 0.5 ? '#cfd8dc' : '#8bc34a';
        ctx.fillRect(x - TILE * 0.08, y - TILE * 0.02, TILE * 0.12, TILE * 0.08);
        ctx.fillStyle = '#795548';
        ctx.fillRect(x + TILE * 0.03, y, TILE * 0.14, TILE * 0.05);
    }

    function drawTrashBin(x, y) {
        ctx.fillStyle = '#1b5e20';
        ctx.fillRect(x - TILE * 0.10, y - TILE * 0.10, TILE * 0.20, TILE * 0.24);
        ctx.fillStyle = '#0d3d13';
        ctx.fillRect(x - TILE * 0.12, y - TILE * 0.14, TILE * 0.24, TILE * 0.06);
    }

    function drawSpeedArrow(x, y) {
        const pulse = Math.sin(performance.now() / 120) * TILE * 0.04;
        const w = TILE * 0.56 + pulse;
        const h = TILE * 0.36 + pulse * 0.4;
        const r = Math.max(3, TILE * 0.08);

        ctx.fillStyle = '#7d3c98';
        ctx.beginPath();
        roundedRectPath(x - w * 0.5, y - h * 0.5, w, h, r);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(x + w * 0.32, y);
        ctx.lineTo(x + w * 0.03, y - h * 0.32);
        ctx.lineTo(x + w * 0.03, y - h * 0.12);
        ctx.lineTo(x - w * 0.33, y - h * 0.12);
        ctx.lineTo(x - w * 0.33, y + h * 0.12);
        ctx.lineTo(x + w * 0.03, y + h * 0.12);
        ctx.lineTo(x + w * 0.03, y + h * 0.32);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.65)';
        ctx.lineWidth = Math.max(1, TILE * 0.045);
        ctx.beginPath();
        ctx.moveTo(x - w * 0.45, y - h * 0.35);
        ctx.lineTo(x - w * 0.28, y - h * 0.35);
        ctx.moveTo(x - w * 0.50, y + h * 0.35);
        ctx.lineTo(x - w * 0.24, y + h * 0.35);
        ctx.stroke();
    }

    function roundedRectPath(x, y, w, h, r) {
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
    }

    function drawPlayer(x, y) {
        const skin = '#2a1711';
        const shirt = '#1f6fb2';
        const pants = '#1f2d3d';
        const headR = TILE * 0.20;
        const headY = y - TILE * 0.27;
        const bodyTop = y - TILE * 0.05;
        const bodyBottom = y + TILE * 0.22;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(x, y + TILE * 0.39, TILE * 0.30, TILE * 0.09, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs
        ctx.strokeStyle = pants;
        ctx.lineWidth = Math.max(3, TILE * 0.10);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x - TILE * 0.09, bodyBottom);
        ctx.lineTo(x - TILE * 0.19, y + TILE * 0.38);
        ctx.moveTo(x + TILE * 0.09, bodyBottom);
        ctx.lineTo(x + TILE * 0.19, y + TILE * 0.38);
        ctx.stroke();

        // Broad shirt
        ctx.fillStyle = shirt;
        ctx.beginPath();
        roundedRectPath(x - TILE * 0.22, bodyTop, TILE * 0.44, TILE * 0.32, Math.max(3, TILE * 0.07));
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.fillRect(x - TILE * 0.04, bodyTop + TILE * 0.04, TILE * 0.08, TILE * 0.20);

        // Arms
        ctx.strokeStyle = skin;
        ctx.lineWidth = Math.max(3, TILE * 0.085);
        ctx.beginPath();
        ctx.moveTo(x - TILE * 0.21, y + TILE * 0.01);
        ctx.lineTo(x - TILE * 0.33, y + TILE * 0.19);
        ctx.moveTo(x + TILE * 0.21, y + TILE * 0.01);
        ctx.lineTo(x + TILE * 0.33, y + TILE * 0.19);
        ctx.stroke();

        // Head, close-cropped hair, and beard
        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.arc(x, headY, headR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(x, headY - headR * 0.38, headR * 1.03, Math.PI, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#15100d';
        ctx.beginPath();
        ctx.arc(x, headY + headR * 0.24, headR * 0.72, 0, Math.PI);
        ctx.fill();

        // Face
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x - headR * 0.32, headY - headR * 0.08, headR * 0.14, 0, Math.PI * 2);
        ctx.arc(x + headR * 0.32, headY - headR * 0.08, headR * 0.14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(x - headR * 0.32, headY - headR * 0.08, headR * 0.07, 0, Math.PI * 2);
        ctx.arc(x + headR * 0.32, headY - headR * 0.08, headR * 0.07, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#f2d6c4';
        ctx.lineWidth = Math.max(1.4, TILE * 0.035);
        ctx.beginPath();
        ctx.arc(x, headY + headR * 0.08, headR * 0.36, 0.1, Math.PI - 0.1);
        ctx.stroke();
        ctx.lineCap = 'butt';
    }

    function drawBou6(x, y) {
        const wheelR = TILE * 0.16;
        const rearX = x - TILE * 0.27;
        const frontX = x + TILE * 0.28;
        const wheelY = y + TILE * 0.20;
        const seatY = y - TILE * 0.04;
        const handleY = y - TILE * 0.12;

        // Motorcycle wheels
        ctx.strokeStyle = '#17202a';
        ctx.lineWidth = Math.max(2, TILE * 0.055);
        ctx.beginPath();
        ctx.arc(rearX, wheelY, wheelR, 0, Math.PI * 2);
        ctx.arc(frontX, wheelY, wheelR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#34495e';
        ctx.beginPath();
        ctx.arc(rearX, wheelY, wheelR * 0.38, 0, Math.PI * 2);
        ctx.arc(frontX, wheelY, wheelR * 0.38, 0, Math.PI * 2);
        ctx.fill();

        // Motorcycle body, fork, and exhaust
        ctx.fillStyle = '#c0392b';
        ctx.beginPath();
        ctx.moveTo(rearX - TILE * 0.02, y + TILE * 0.04);
        ctx.lineTo(x - TILE * 0.06, y - TILE * 0.13);
        ctx.lineTo(x + TILE * 0.18, y - TILE * 0.10);
        ctx.lineTo(frontX + TILE * 0.04, y + TILE * 0.04);
        ctx.lineTo(x + TILE * 0.08, y + TILE * 0.12);
        ctx.lineTo(rearX + TILE * 0.03, y + TILE * 0.10);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(x - TILE * 0.16, seatY - TILE * 0.03, TILE * 0.30, TILE * 0.08);

        ctx.strokeStyle = '#2c3e50';
        ctx.lineWidth = Math.max(2, TILE * 0.055);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(frontX, wheelY);
        ctx.lineTo(frontX - TILE * 0.05, handleY);
        ctx.lineTo(frontX + TILE * 0.08, handleY - TILE * 0.02);
        ctx.moveTo(rearX - TILE * 0.03, y + TILE * 0.08);
        ctx.lineTo(rearX - TILE * 0.22, y + TILE * 0.11);
        ctx.stroke();

        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(frontX + TILE * 0.05, y - TILE * 0.02, TILE * 0.035, 0, Math.PI * 2);
        ctx.fill();

        // Rider body, head, helmet, and arms.
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = Math.max(2, TILE * 0.07);
        ctx.beginPath();
        ctx.moveTo(x - TILE * 0.06, seatY);
        ctx.lineTo(x - TILE * 0.08, y - TILE * 0.25);
        ctx.lineTo(frontX - TILE * 0.02, handleY);
        ctx.moveTo(x - TILE * 0.06, seatY);
        ctx.lineTo(rearX + TILE * 0.08, wheelY - TILE * 0.05);
        ctx.moveTo(x - TILE * 0.05, seatY);
        ctx.lineTo(x + TILE * 0.13, wheelY - TILE * 0.03);
        ctx.stroke();

        ctx.fillStyle = '#f2c29d';
        ctx.beginPath();
        ctx.arc(x - TILE * 0.10, y - TILE * 0.34, TILE * 0.12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#2c3e50';
        ctx.beginPath();
        ctx.arc(x - TILE * 0.10, y - TILE * 0.38, TILE * 0.13, Math.PI, Math.PI * 2);
        ctx.fill();

        // Angry eye
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(x - TILE * 0.05, y - TILE * 0.35, TILE * 0.018, 0, Math.PI * 2);
        ctx.fill();

        ctx.lineCap = 'butt';

        // Label
        ctx.fillStyle = '#ffe066';
        ctx.font = `bold ${Math.max(7, TILE * 0.22)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('BOU6', x, y + TILE * 0.36);
    }

    // BFS pathfinding
    function findPath(startTile, endTile) {
        if (startTile.x === endTile.x && startTile.y === endTile.y) return [];
        const visited = Array(GRID_ROWS).fill(null).map(() => Array(GRID_COLS).fill(false));
        const prev = Array(GRID_ROWS).fill(null).map(() => Array(GRID_COLS).fill(null));
        const queue = [startTile];
        visited[startTile.y][startTile.x] = true;
        const dirs = [{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];

        while (queue.length > 0) {
            const curr = queue.shift();
            if (curr.x === endTile.x && curr.y === endTile.y) {
                // Reconstruct
                const result = [];
                let c = endTile;
                while (c && (c.x !== startTile.x || c.y !== startTile.y)) {
                    result.unshift(c);
                    c = prev[c.y][c.x];
                }
                return result;
            }
            for (const d of dirs) {
                const nx = curr.x + d.x;
                const ny = curr.y + d.y;
                if (nx >= 0 && nx < GRID_COLS && ny >= 0 && ny < GRID_ROWS && !visited[ny][nx] && grid[ny][nx] === 0) {
                    visited[ny][nx] = true;
                    prev[ny][nx] = curr;
                    queue.push({x: nx, y: ny});
                }
            }
        }
        return [];
    }

    // Game loop
    function gameLoop(timestamp) {
        if (gameOver) return;
        const dt = timestamp - lastTime;
        lastTime = timestamp;
        if (dt > 100) { animFrame = requestAnimationFrame(gameLoop); return; }
        const step = dt / 1000;
        const currentPlayerSpeed = playerSpeed * (boostUntil > timestamp ? 1.45 : 1);
        const currentBou6Speed = bou6Speed * (bou6BoostUntil > timestamp ? 1.55 : 1);

        // Move player along drawn path
        if (gameStarted && pathIndex < path.length - 1) {
            const target = path[pathIndex + 1];
            const dx = target.x - playerPixel.x;
            const dy = target.y - playerPixel.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const move = currentPlayerSpeed * step;
            if (dist < move) {
                playerPixel.x = target.x;
                playerPixel.y = target.y;
                pathIndex++;
                if (tilePath[pathIndex]) playerPos = { ...tilePath[pathIndex] };
            } else {
                playerPixel.x += (dx / dist) * move;
                playerPixel.y += (dy / dist) * move;
            }
        }

        // Move bou6 chasing player
        if (gameStarted && timestamp - gameStartTime > chaseDelay) {
            const playerTile = { x: Math.floor(playerPixel.x / TILE), y: Math.floor(playerPixel.y / TILE) };
            const bou6Tile = { x: Math.floor(bou6Pixel.x / TILE), y: Math.floor(bou6Pixel.y / TILE) };

            // Recalculate path periodically
            if (!bou6Path.length || bou6PathIndex >= bou6Path.length || Math.random() < 0.06) {
                bou6Path = findPath(bou6Tile, playerTile);
                bou6PathIndex = 0;
            }

            if (bou6Path.length > 0 && bou6PathIndex < bou6Path.length) {
                const bTarget = bou6Path[bou6PathIndex];
                const btx = bTarget.x * TILE + TILE / 2;
                const bty = bTarget.y * TILE + TILE / 2;
                const bdx = btx - bou6Pixel.x;
                const bdy = bty - bou6Pixel.y;
                const bdist = Math.sqrt(bdx * bdx + bdy * bdy);
                const bou6Move = currentBou6Speed * step;
                if (bdist < bou6Move) {
                    bou6Pixel.x = btx;
                    bou6Pixel.y = bty;
                    bou6PathIndex++;
                } else {
                    bou6Pixel.x += (bdx / bdist) * bou6Move;
                    bou6Pixel.y += (bdy / bdist) * bou6Move;
                }
            }
        }

        collectPickups(timestamp);

        // Collision check
        const cdx = playerPixel.x - bou6Pixel.x;
        const cdy = playerPixel.y - bou6Pixel.y;
        if (gameStarted && Math.sqrt(cdx * cdx + cdy * cdy) < TILE * 0.55) {
            gameOver = true;
            showOverlay('CAUGHT!', 'Bou6 got you! Try a different path.', 'Retry');
        }

        // Win check
        const hdx = playerPixel.x - (homePos.x * TILE + TILE / 2);
        const hdy = playerPixel.y - (homePos.y * TILE + TILE / 2);
        if (gameStarted && Math.sqrt(hdx * hdx + hdy * hdy) < TILE * 0.6) {
            gameOver = true;
            won = true;
            if (level >= 5) {
                showOverlay('YOU WIN!', `You escaped all 5 levels and grabbed ${collectedStars}/${stars.length} stars here!`, 'Play Again');
            } else {
                showOverlay('SAFE!', `Level ${level} complete with ${collectedStars}/${stars.length} stars. Bou6 gets faster...`, 'Next Level');
            }
        }

        updateStats();
        draw();
        animFrame = requestAnimationFrame(gameLoop);
    }

    function collectPickups(timestamp) {
        const playerTile = { x: Math.floor(playerPixel.x / TILE), y: Math.floor(playerPixel.y / TILE) };
        const bou6Tile = { x: Math.floor(bou6Pixel.x / TILE), y: Math.floor(bou6Pixel.y / TILE) };
        for (const star of stars) {
            if (!star.collected && sameTile(star, playerTile)) {
                star.collected = true;
                collectedStars++;
            }
        }

        for (let i = boostPickups.length - 1; i >= 0; i--) {
            const boost = boostPickups[i];
            if (sameTile(boost, playerTile)) {
                boostPickups.splice(i, 1);
                boostUntil = timestamp + 3000;
            } else if (sameTile(boost, bou6Tile)) {
                boostPickups.splice(i, 1);
                bou6BoostUntil = timestamp + 2500;
                bou6Path = [];
                bou6PathIndex = 0;
            }
        }
    }

    function showOverlay(title, sub, btnText) {
        overlayTitle.textContent = title;
        overlaySub.textContent = sub;
        overlayBtn.textContent = btnText;
        overlay.classList.add('show');
    }

    overlayBtn.addEventListener('click', () => {
        if (won) {
            if (level >= 5) {
                level = 1;
                for (let i = 0; i < 5; i++) levels[i] = generateLevel(i + 1);
            } else {
                level++;
            }
        }
        initLevel();
    });

    // Input handling - works for both mouse and touch
    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function posToTile(pos) {
        return { x: Math.floor(pos.x / TILE), y: Math.floor(pos.y / TILE) };
    }

    function syncPathFromTiles() {
        path = tilePath.map(tileToPixel);
    }

    function addRouteTile(tile) {
        if (!isStreetTile(tile)) return;
        const last = tilePath[tilePath.length - 1];
        if (sameTile(last, tile)) return;

        const previous = tilePath[tilePath.length - 2];
        if (sameTile(previous, tile)) {
            tilePath.pop();
            syncPathFromTiles();
            return;
        }

        if (tileDistance(last, tile) === 1) {
            tilePath.push(tile);
            syncPathFromTiles();
            return;
        }

        const bridge = findPath(last, tile);
        if (bridge.length) {
            tilePath.push(...bridge);
            syncPathFromTiles();
        }
    }

    function onStart(e) {
        e.preventDefault();
        if (gameOver || gameStarted) return;
        const pos = getCanvasPos(e);
        // Must start near player
        const dx = pos.x - playerPixel.x;
        const dy = pos.y - playerPixel.y;
        if (Math.sqrt(dx * dx + dy * dy) < TILE * 2) {
            drawing = true;
            tilePath = [{ ...playerPos }];
            syncPathFromTiles();
        }
    }

    function onMove(e) {
        e.preventDefault();
        if (!drawing) return;
        const pos = getCanvasPos(e);
        addRouteTile(posToTile(pos));
        draw();
    }

    function onEnd(e) {
        e.preventDefault();
        if (!drawing) return;
        drawing = false;
        const lastTile = tilePath[tilePath.length - 1];
        if (!sameTile(lastTile, homePos)) {
            const homeBridge = findPath(lastTile, homePos);
            if (homeBridge.length) {
                tilePath.push(...homeBridge);
                syncPathFromTiles();
            }
        }

        if (tilePath.length > 3 && sameTile(tilePath[tilePath.length - 1], homePos)) {
            gameStarted = true;
            pathIndex = 0;
            lastTime = performance.now();
            gameStartTime = lastTime;
            animFrame = requestAnimationFrame(gameLoop);
        } else {
            tilePath = [];
            path = [];
            draw();
        }
    }

    // Touch events
    canvas.addEventListener('touchstart', onStart, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onEnd, { passive: false });
    // Mouse events
    canvas.addEventListener('mousedown', onStart);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onEnd);

    initLevel();
    </script>
</body>
